<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project 54 — Training Manual Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:       #354739;
      --green-hover: #2a3a2d;
      --amber:       #CE8523;
      --cream:       #EBE5D8;
      --cream-dark:  #ddd7c8;
      --red:         #BB3917;
      --teal:        #355C6D;
      --white:       #FDFAF5;
      --border:      rgba(53,71,57,0.13);
      --shadow:      0 2px 12px rgba(53,71,57,0.08);
      --shadow-lg:   0 4px 24px rgba(53,71,57,0.13);
      --font-body:   'Lato', sans-serif;
      --font-ui:     'Montserrat', sans-serif;
      --font-brand:  'Anton', sans-serif;
    }

    html, body { height: 100%; overflow: hidden; }
    body { font-family: var(--font-body); color: var(--green); background: var(--cream); display: flex; }

    /* ══ SIDEBAR ════════════════════════════════════ */
    .sidebar {
      width: 230px;
      flex-shrink: 0;
      background: var(--green);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      transition: width 0.25s ease;
      position: relative;
      z-index: 10;
    }

    .sidebar.collapsed { width: 0; }

    .sidebar-top {
      flex-shrink: 0;
      padding: 16px 14px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    /* Sidebar brand */
    .sidebar-brand {
      font-family: var(--font-brand);
      font-size: 1rem;
      letter-spacing: 1.5px;
      color: var(--cream);
      margin-bottom: 14px;
    }

    .sidebar-brand span { color: var(--amber); }

    .new-manual-btn {
      width: 100%;
      padding: 9px 12px;
      background: rgba(206,133,35,0.14);
      border: 1px solid rgba(206,133,35,0.28);
      border-radius: 8px;
      color: var(--amber);
      font-family: var(--font-ui);
      font-size: 0.77rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .new-manual-btn:hover { background: rgba(206,133,35,0.25); }

    .sidebar-section-label {
      padding: 12px 14px 5px;
      font-family: var(--font-ui);
      font-size: 0.59rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(235,229,216,0.3);
      white-space: nowrap;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 16px;
    }

    .sidebar-list::-webkit-scrollbar { width: 3px; }
    .sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

    .sidebar-item {
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .sidebar-item:hover { background: rgba(255,255,255,0.06); }
    .sidebar-item.active { background: rgba(206,133,35,0.15); }

    .sidebar-item-main { flex: 1; min-width: 0; }

    .sidebar-item-title {
      font-family: var(--font-ui);
      font-size: 0.77rem;
      font-weight: 500;
      color: var(--cream);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .sidebar-item.active .sidebar-item-title { color: var(--amber); }

    .sidebar-item-date {
      font-size: 0.67rem;
      color: rgba(235,229,216,0.3);
      margin-top: 2px;
      white-space: nowrap;
    }

    .sidebar-item-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }

    .sidebar-item:hover .sidebar-item-actions { opacity: 1; }

    .sidebar-action {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 5px;
      border-radius: 5px;
      color: rgba(235,229,216,0.45);
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar-action:hover { background: rgba(255,255,255,0.1); color: var(--cream); }
    .sidebar-action.del:hover { color: #e07060; }
    .sidebar-action svg { width: 12px; height: 12px; }

    .sidebar-empty {
      padding: 18px 14px;
      font-size: 0.77rem;
      color: rgba(235,229,216,0.28);
      font-family: var(--font-ui);
      line-height: 1.5;
    }

    /* ══ MAIN ═══════════════════════════════════════ */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      min-width: 0;
      position: relative;
    }

    /* HEADER */
    .app-header {
      flex-shrink: 0;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      z-index: 50;
    }

    .header-bar {
      display: flex;
      align-items: center;
      height: 72px;
      padding: 0 20px;
      gap: 14px;
    }

    .sidebar-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 7px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .sidebar-toggle:hover { border-color: var(--green); }
    .sidebar-toggle svg { width: 14px; height: 14px; }

    /* Header logo mark */
    .logo-mark {
      font-family: var(--font-brand);
      font-size: 1.05rem;
      letter-spacing: 1.5px;
      background: var(--green);
      color: var(--cream);
      padding: 6px 13px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .logo-mark span { color: var(--amber); }

    .header-logo-divider {
      width: 1.5px;
      height: 36px;
      background: var(--border);
      flex-shrink: 0;
    }

    .header-title {
      font-family: var(--font-ui);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--teal);
      flex: 1;
    }

    .settings-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 7px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      opacity: 0.5;
      flex-shrink: 0;
    }

    .settings-btn:hover, .settings-btn.active { opacity: 1; border-color: var(--amber); }
    .settings-btn svg { width: 14px; height: 14px; }

    /* Settings drawer */
    .settings-drawer { display: none; background: var(--cream); border-bottom: 1px solid var(--border); padding: 11px 18px; }
    .settings-drawer.open { display: block; }

    .settings-row { display: flex; align-items: center; gap: 10px; max-width: 780px; }

    .settings-label {
      font-family: var(--font-ui);
      font-size: 0.63rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--amber);
      white-space: nowrap;
    }

    .key-input {
      flex: 1;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 12px;
      color: var(--green);
      font-family: monospace;
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .key-input:focus { border-color: var(--amber); }

    .btn-sm {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 12px;
      color: var(--green);
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 0.72rem;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-sm:hover { border-color: var(--amber); color: var(--amber); }
    .key-hint { font-size: 0.68rem; color: var(--teal); white-space: nowrap; opacity: 0.7; }

    /* ══ CHAT AREA ═══════════════════════════════════ */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 32px 20px 20px;
      scroll-behavior: smooth;
    }

    .chat-area::-webkit-scrollbar { width: 5px; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--cream-dark); border-radius: 4px; }

    .chat-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* ── Messages ── */
    .message { display: flex; gap: 12px; align-items: flex-start; }
    .message-user { flex-direction: row-reverse; }

    .msg-avatar {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(53,71,57,0.2);
      font-family: var(--font-brand);
      font-size: 0.7rem;
      color: var(--amber);
    }


    .msg-bubble { max-width: 72%; }

    .msg-bubble-inner {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 4px 14px 14px 14px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
      font-size: 0.92rem;
      line-height: 1.72;
      color: var(--green);
    }

    .message-user .msg-bubble-inner {
      background: var(--green);
      color: var(--cream);
      border-radius: 14px 4px 14px 14px;
      border-color: transparent;
    }

    .user-images { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }

    .user-img-thumb {
      width: 70px;
      height: 70px;
      border-radius: 8px;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.18);
    }

    .user-file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 0.76rem;
      margin-bottom: 7px;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Welcome */
    .welcome-wrap { max-width: 520px; }

    .welcome-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 4px 18px 18px 18px;
      padding: 28px 32px 30px;
      box-shadow: var(--shadow);
    }

    .welcome-logo-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .welcome-logo {
      font-family: var(--font-brand);
      font-size: 1.3rem;
      letter-spacing: 2px;
      background: var(--green);
      color: var(--cream);
      padding: 6px 14px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .welcome-logo span { color: var(--amber); }

    .welcome-subtitle {
      font-family: var(--font-ui);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--teal);
    }

    .welcome-text {
      font-size: 1.06rem;
      line-height: 1.75;
      color: var(--green);
    }

    .welcome-text strong { color: var(--amber); font-weight: 700; }

    /* Manual card */
    .manual-wrap { max-width: 88%; }

    .manual-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-top: 3px solid var(--green);
      border-radius: 4px 14px 14px 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .manual-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: var(--cream);
      border-bottom: 1px solid var(--border);
    }

    .manual-badge {
      font-family: var(--font-ui);
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--amber);
    }

    .manual-actions { display: flex; gap: 6px; }

    .manual-action-btn {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 11px;
      color: var(--green);
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 0.7rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .manual-action-btn:hover { border-color: var(--amber); color: var(--amber); }

    .manual-text {
      padding: 20px 22px;
      font-size: 0.9rem;
      line-height: 1.85;
      color: var(--green);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 500px;
      overflow-y: auto;
    }

    .manual-text::-webkit-scrollbar { width: 4px; }
    .manual-text::-webkit-scrollbar-thumb { background: var(--cream-dark); border-radius: 3px; }

    /* Typing dots */
    .typing-dots { display: flex; gap: 5px; align-items: center; padding: 2px 0; }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce { 0%,80%,100%{transform:scale(0.65);opacity:0.45} 40%{transform:scale(1);opacity:1} }

    /* System message */
    .system-wrap { display: flex; justify-content: center; }

    .system-msg {
      font-family: var(--font-ui);
      font-size: 0.72rem;
      color: var(--teal);
      background: rgba(53,92,109,0.07);
      border-radius: 20px;
      padding: 5px 14px;
      letter-spacing: 0.3px;
    }

    /* ══ SCROLL TO BOTTOM BUTTON ══════════════════════ */
    .scroll-bottom-btn {
      position: fixed;
      bottom: 110px;
      right: 24px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--white);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 40;
      color: var(--green);
      transition: all 0.2s;
    }

    .scroll-bottom-btn.visible { display: flex; }
    .scroll-bottom-btn:hover { background: var(--cream); border-color: var(--green); transform: translateY(1px); }
    .scroll-bottom-btn svg { width: 15px; height: 15px; }

    /* ══ DRAG OVERLAY ════════════════════════════════ */
    .drag-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(235,229,216,0.9);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }

    .drag-overlay.active { display: flex; }

    .drag-zone {
      width: 320px;
      height: 190px;
      border: 2.5px dashed var(--green);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--white);
      box-shadow: var(--shadow-lg);
    }

    .drag-zone svg { color: var(--green); opacity: 0.35; }

    .drag-zone h3 {
      font-family: var(--font-brand);
      font-size: 1.05rem;
      letter-spacing: 1px;
      color: var(--green);
    }

    .drag-zone p { font-size: 0.76rem; color: var(--teal); font-family: var(--font-ui); }

    /* ══ INPUT SECTION ════════════════════════════════ */
    .input-section {
      flex-shrink: 0;
      background: var(--white);
      border-top: 1px solid var(--border);
      padding: 12px 18px 18px;
      position: relative;
    }

    /* Attach panel */
    .attach-panel {
      position: absolute;
      bottom: calc(100% + 4px);
      left: 18px;
      width: 205px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 -4px 20px rgba(53,71,57,0.1);
      padding: 5px;
      display: none;
      z-index: 100;
      animation: fadeUp 0.15s ease;
    }

    .attach-panel.open { display: block; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

    .attach-option {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 11px;
      border: none;
      background: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
      color: var(--green);
    }

    .attach-option:hover { background: var(--cream); }

    .attach-ico {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--green);
    }

    .attach-ico svg { width: 13px; height: 13px; }
    .attach-name { font-family: var(--font-ui); font-size: 0.77rem; font-weight: 600; color: var(--green); }
    .attach-divider { height: 1px; background: var(--border); margin: 4px 8px; }

    /* Attachment chips bar */
    .attachments-bar {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 0 10px 42px;
      max-width: 780px;
      margin: 0 auto;
    }

    .attachments-bar.has-items { display: flex; }

    .attach-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px 4px 9px;
      font-family: var(--font-ui);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--green);
      max-width: 190px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .attach-chip:hover { border-color: var(--amber); background: #f0ebe0; }
    .attach-chip svg { flex-shrink: 0; width: 11px; height: 11px; color: var(--teal); }
    .chip-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

    .chip-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(53,71,57,0.35);
      font-size: 0.88rem;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .chip-remove:hover { color: var(--red); }

    /* ══ ATTACHMENT PREVIEW POPUP ════════════════════ */
    .attach-preview-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 600;
      background: rgba(40, 50, 42, 0.35);
      align-items: center;
      justify-content: center;
    }

    .attach-preview-overlay.visible { display: flex; }

    .attach-preview-popup {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 12px 48px rgba(53,71,57,0.22);
      width: 400px;
      max-width: 92vw;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: popIn 0.14s ease;
    }

    @keyframes popIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }

    .attach-preview-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px 11px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--cream);
    }

    .attach-preview-badge {
      font-family: var(--font-ui);
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--amber);
      flex-shrink: 0;
    }

    .attach-preview-name {
      font-family: var(--font-ui);
      font-size: 0.77rem;
      font-weight: 600;
      color: var(--green);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attach-preview-close {
      background: none;
      border: none;
      cursor: pointer;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(53,71,57,0.4);
      font-size: 1rem;
      line-height: 1;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .attach-preview-close:hover { background: rgba(187,57,23,0.08); color: var(--red); }

    .attach-preview-body { flex: 1; overflow: auto; }

    .attach-preview-img {
      width: 100%;
      height: auto;
      max-height: 65vh;
      object-fit: contain;
      display: block;
      background: #f0ece4;
    }

    .attach-preview-text {
      padding: 16px 18px;
      font-family: var(--font-body);
      font-size: 0.84rem;
      line-height: 1.75;
      color: var(--green);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .attach-preview-meta {
      padding: 8px 18px 14px;
      font-family: var(--font-ui);
      font-size: 0.65rem;
      color: var(--teal);
      opacity: 0.7;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .attach-preview-empty {
      padding: 36px 18px;
      text-align: center;
      font-family: var(--font-ui);
      font-size: 0.76rem;
      color: var(--teal);
      opacity: 0.6;
    }

    .chip-img-thumb {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* Input wrapper */
    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--cream);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 8px 8px 8px 6px;
      max-width: 780px;
      margin: 0 auto;
      transition: border-color 0.2s;
      position: relative;
    }

    .input-wrapper:focus-within { border-color: rgba(53,71,57,0.38); }
    .input-wrapper.drag-over { border-color: var(--amber); border-style: dashed; }

    /* Inline status (recording/listening) */
    .inline-status {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0; right: 0;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 14px;
      font-family: var(--font-ui);
      font-size: 0.72rem;
      font-weight: 500;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .inline-status.visible { display: flex; }

    .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; animation: pulse 1s infinite; }
    .status-dot.red  { background: var(--red); }
    .status-dot.teal { background: var(--teal); }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

    .status-text { flex: 1; color: var(--green); }

    .status-stop-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 9px;
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 0.67rem;
      font-weight: 600;
      color: var(--green);
      transition: all 0.15s;
    }

    .status-stop-btn:hover { border-color: var(--red); color: var(--red); }

    /* + button */
    .plus-btn {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 1.5px solid var(--border);
      background: var(--white);
      color: var(--green);
      font-size: 1.2rem;
      font-weight: 300;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      line-height: 1;
    }

    .plus-btn:hover { border-color: var(--green); }
    .plus-btn.open  { border-color: var(--amber); color: var(--amber); transform: rotate(45deg); }

    /* Textarea */
    #notes {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      resize: none;
      font-family: var(--font-body);
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--green);
      padding: 5px 4px;
      min-height: 32px;
      max-height: 160px;
      overflow-y: auto;
    }

    #notes::placeholder { color: rgba(53,71,57,0.35); }

    /* Send button */
    .send-btn {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: none;
      background: var(--green);
      color: var(--cream);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .send-btn:hover { background: var(--green-hover); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .send-btn svg { width: 14px; height: 14px; }

    .input-footer {
      max-width: 780px;
      margin: 7px auto 0;
      text-align: center;
      font-size: 0.67rem;
      color: rgba(53,71,57,0.36);
      font-family: var(--font-ui);
      letter-spacing: 0.3px;
    }

    /* All file inputs — always fully hidden */
    #file-input,
    #audio-input,
    #image-input { display: none !important; visibility: hidden !important; position: absolute !important; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--cream-dark); border-radius: 4px; }
  </style>
</head>
<body>

  <!-- ── SIDEBAR ──────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">PROJECT <span>54</span></div>
      <button class="new-manual-btn" id="new-manual-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New Manual
      </button>
    </div>
    <div class="sidebar-section-label">Saved Manuals</div>
    <div class="sidebar-list" id="sidebar-list">
      <div class="sidebar-empty">Your manuals will appear here.</div>
    </div>
  </aside>

  <!-- ── MAIN ─────────────────────────────────── -->
  <div class="main">

    <!-- HEADER -->
    <header class="app-header">
      <div class="header-bar">
        <button class="sidebar-toggle" id="sidebar-toggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="logo-mark">PROJECT <span>54</span></div>
        <div class="header-logo-divider"></div>
        <div class="header-title">Training Manual Assistant</div>
        <button class="settings-btn" id="settings-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </div>
      <div class="settings-drawer" id="settings-drawer">
        <div class="settings-row">
          <span class="settings-label">Groq Key</span>
          <input class="key-input" type="password" id="api-key" placeholder="gsk_..." autocomplete="off"/>
          <button class="btn-sm" id="toggle-btn">Show</button>
          <span class="key-hint">Sent directly to Groq — never stored.</span>
        </div>
      </div>
    </header>

    <!-- CHAT -->
    <div class="chat-area" id="chat-area">
      <div class="chat-inner" id="chat-inner"></div>
    </div>

    <!-- SCROLL TO BOTTOM BUTTON -->
    <button class="scroll-bottom-btn" id="scroll-bottom-btn" title="Scroll to bottom">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>
      </svg>
    </button>

    <!-- DRAG OVERLAY -->
    <div class="drag-overlay" id="drag-overlay">
      <div class="drag-zone">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
        <h3>DROP FILE HERE</h3>
        <p>PDF, Word, image, or audio</p>
      </div>
    </div>

    <!-- INPUT SECTION -->
    <div class="input-section">

      <!-- Attach panel -->
      <div class="attach-panel" id="attach-panel">
        <button class="attach-option" id="opt-file">
          <div class="attach-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
              <line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="12" y2="12"/><line x1="15" y1="15" x2="12" y2="12"/>
            </svg>
          </div>
          <span class="attach-name">Upload Document</span>
        </button>
        <button class="attach-option" id="opt-image">
          <div class="attach-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <span class="attach-name">Upload Image</span>
        </button>
        <button class="attach-option" id="opt-audio">
          <div class="attach-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <line x1="12" y1="2" x2="12" y2="22"/><line x1="8" y1="6" x2="8" y2="18"/>
              <line x1="4" y1="10" x2="4" y2="14"/><line x1="16" y1="6" x2="16" y2="18"/><line x1="20" y1="10" x2="20" y2="14"/>
            </svg>
          </div>
          <span class="attach-name">Upload Audio</span>
        </button>
        <div class="attach-divider"></div>
        <button class="attach-option" id="opt-speak">
          <div class="attach-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
              <path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </div>
          <span class="attach-name" id="speak-label">Live Speak</span>
        </button>
        <button class="attach-option" id="opt-record">
          <div class="attach-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="9"/>
              <circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/>
            </svg>
          </div>
          <span class="attach-name" id="record-label">Record Audio</span>
        </button>
      </div>

      <!-- Chips -->
      <div class="attachments-bar" id="attachments-bar"></div>

      <!-- Input row -->
      <div class="input-wrapper" id="input-wrapper">
        <div class="inline-status" id="inline-status">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="status-text"></span>
          <button class="status-stop-btn" id="status-stop">Stop</button>
        </div>
        <button class="plus-btn" id="plus-btn">+</button>
        <textarea id="notes" rows="1" autofocus
          placeholder="Ask me anything, or describe what you'd like to create…"></textarea>
        <button class="send-btn" id="send-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>

      <p class="input-footer">Project 54 Training Assistant &mdash; Powered by Groq &amp; Llama 3.3</p>

      <!-- Fully hidden file inputs -->
      <input type="file" id="file-input"  accept=".pdf,.doc,.docx"/>
      <input type="file" id="audio-input" accept="audio/*,.mp3,.mp4,.m4a,.wav,.ogg,.flac"/>
      <input type="file" id="image-input" accept="image/*"/>
    </div>

  </div><!-- /main -->

  <!-- ── ATTACHMENT PREVIEW POPUP ──────────────── -->
  <div class="attach-preview-overlay" id="attach-preview-overlay">
    <div class="attach-preview-popup" id="attach-preview-popup">
      <div class="attach-preview-header">
        <span class="attach-preview-badge" id="attach-preview-badge"></span>
        <span class="attach-preview-name" id="attach-preview-name"></span>
        <button class="attach-preview-close" id="attach-preview-close" title="Close">×</button>
      </div>
      <div class="attach-preview-body" id="attach-preview-body"></div>
    </div>
  </div>

  <script src="groq.js"></script>
  <script src="app.js"></script>
</body>
</html>
